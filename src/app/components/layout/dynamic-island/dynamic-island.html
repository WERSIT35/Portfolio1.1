<nav
  class="island"
  [class.is-open]="expanded()"
  [appMagnetic]="0.12"
  aria-label="Primary"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
  (keydown.escape)="close()"
>
  <a class="island__brand" routerLink="/" fragment="top" aria-label="Back to top" (click)="close()">
    OD
  </a>

  <div class="island__label" aria-hidden="true">
    <span #labelText class="island__label-text">
      @for (label of [activeLabel()]; track label) {
        <span class="island__label-word">{{ label }}</span>
      }
    </span>
  </div>

  <div id="island-panel" class="island__panel" [attr.inert]="expanded() ? null : ''">
    <div #panelInner class="island__panel-inner">
      <ul class="island__links">
        @for (item of navItems; track item.id; let i = $index) {
          <li [style.--i]="i">
            <a
              class="island__link"
              routerLink="/"
              [fragment]="item.id"
              [class.is-active]="activeId() === item.id"
              [attr.aria-current]="activeId() === item.id ? 'location' : null"
              (click)="close()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>

      <span class="island__divider" aria-hidden="true"></span>

      <ul class="island__socials" [style.--i]="navItems.length">
        <li>
          <a class="island__social" [href]="contact.github" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path
                d="M12 1.5a10.5 10.5 0 0 0-3.32 20.47c.52.1.71-.23.71-.5v-1.76c-2.9.63-3.52-1.4-3.52-1.4-.47-1.2-1.16-1.52-1.16-1.52-.94-.65.08-.63.08-.63 1.05.07 1.6 1.08 1.6 1.08.93 1.6 2.44 1.14 3.03.87.1-.68.37-1.14.66-1.4-2.32-.26-4.76-1.16-4.76-5.17 0-1.14.4-2.08 1.07-2.81-.1-.26-.47-1.33.1-2.77 0 0 .88-.28 2.87 1.07a9.9 9.9 0 0 1 5.22 0c2-1.35 2.87-1.07 2.87-1.07.57 1.44.2 2.51.1 2.77.67.73 1.07 1.67 1.07 2.81 0 4.02-2.44 4.9-4.77 5.16.38.33.71.97.71 1.96v2.9c0 .27.19.6.72.5A10.5 10.5 0 0 0 12 1.5Z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a class="island__social" [href]="contact.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path
                d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11H3v-11Zm6.5 0h3.83v1.5h.06c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.13v5.43h-4v-4.82c0-1.15-.02-2.63-1.6-2.63-1.6 0-1.85 1.25-1.85 2.55v4.9h-4v-11Z"
              />
            </svg>
          </a>
        </li>
        <li>
          <a class="island__social" [href]="'mailto:' + contact.email" aria-label="Email">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.75" />
              <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <button
    type="button"
    class="island__toggle"
    [attr.aria-expanded]="expanded()"
    aria-controls="island-panel"
    [attr.aria-label]="expanded() ? 'Close navigation' : 'Open navigation'"
    (click)="toggle()"
  >
    <span class="island__dot"></span>
  </button>
</nav>
