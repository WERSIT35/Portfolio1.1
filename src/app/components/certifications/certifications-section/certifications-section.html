<section id="certifications" appSpySection tabindex="-1" class="cx" aria-labelledby="cx-title">
  <header class="cx__head">
    <p class="cx__kicker">05 / Certifications</p>
    <h2 id="cx-title" class="cx__title">On the record</h2>
    <p class="cx__count">{{ count }} certificates</p>
  </header>

  <div class="cx__body">
    <div class="side">
      <!-- The wall: one mark per issuer. Highlighting a mark dims the other issuers' rows. -->
      <ul
        class="wall"
        aria-label="Issuers"
        (pointerleave)="$event.pointerType === 'mouse' && issuer.set(null)"
      >
        @for (i of issuers; track i.id) {
          <li>
            <button
              type="button"
              class="mark"
              [class.is-on]="lit() === i.id"
              [class.is-dim]="lit() !== null && lit() !== i.id"
              [attr.aria-pressed]="issuer() === i.id"
              (pointerenter)="$event.pointerType === 'mouse' && issuer.set(i.id)"
              (focus)="onMarkFocus($event, i.id)"
              (blur)="issuer.set(null)"
              (click)="onMarkTap($event, i.id)"
            >
              <span class="mark__logo"><app-issuer-logo [issuer]="i.id" size="lg" /></span>
              <span class="mark__name">{{ i.name }}</span>
              <span class="mark__count">{{ i.count }}</span>
            </button>
          </li>
        }
      </ul>

      <!-- Desktop: the paper itself, for whichever row is under the pointer. -->
      <figure class="preview" aria-hidden="true">
        @for (c of certs; track c.id) {
          <img
            class="preview__img"
            [class.is-on]="preview().id === c.id"
            [src]="c.plate"
            alt=""
            loading="lazy"
            decoding="async"
          />
        }
        <figcaption class="preview__caption">
          {{ preview().index }} — {{ preview().title }}
        </figcaption>
      </figure>
    </div>

    <ol class="ledger" (pointerleave)="hovered.set(null)">
      @for (c of certs; track c.id) {
        <li
          class="row"
          [class.is-dim]="issuer() !== null && issuer() !== c.issuerId"
          (pointerenter)="$event.pointerType === 'mouse' && hovered.set(c.id)"
        >
          <button
            type="button"
            class="row__open"
            (focus)="hovered.set(c.id)"
            (blur)="hovered.set(null)"
            (click)="open(c)"
          >
            <span class="row__index" aria-hidden="true">{{ c.index }}</span>
            <span class="row__title">{{ c.title }}</span>
            <span class="row__meta">
              @if (c.issuerId) {
                <app-issuer-logo [issuer]="c.issuerId" />
              }
              {{ c.issuer }}
              @if (c.year) {
                · {{ c.year }}
              }
              @if (c.timeSpent) {
                · {{ c.timeSpent }}
              }
            </span>
            <svg class="row__arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </li>
      }
    </ol>
  </div>

  <!-- The certificate at full size, in its own colours. -->
  <dialog
    #dialog
    class="lightbox"
    aria-label="Certificate"
    (click)="onDialogClick($event)"
    (close)="lightbox.set(null)"
  >
    @if (lightbox(); as c) {
      <figure class="lightbox__figure">
        <img [src]="c.full" [alt]="c.title + ' certificate, issued by ' + c.issuer" />
        <figcaption class="lightbox__caption">
          <span class="lightbox__issuer">
            @if (c.issuerId) {
              <app-issuer-logo [issuer]="c.issuerId" />
            }
            {{ c.issuer }} · {{ c.issued }}
          </span>
          <strong class="lightbox__title">{{ c.title }}</strong>
          @if (c.description) {
            <span class="lightbox__desc">{{ c.description }}</span>
          }
          @if (c.verifyUrl || c.pdfUrl) {
            <span class="lightbox__links">
              @if (c.verifyUrl) {
                <a [href]="c.verifyUrl" target="_blank" rel="noopener">Verify credential ↗</a>
              }
              @if (c.pdfUrl) {
                <a [href]="c.pdfUrl" target="_blank" rel="noopener">View PDF ↗</a>
              }
            </span>
          }
        </figcaption>
      </figure>
      <button type="button" class="lightbox__close" (click)="close()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6 6 18"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
          />
        </svg>
      </button>
    }
  </dialog>
</section>
